<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a date</title>

     <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>
    <div class="hero-section">
        <main class="hero">
            <img src="Logo/Camp_Okra (1).png" alt="Camp Okra Logo" class="logo">
    <div class="Schedule_appointment">
        <div class="Schedule_header">
            <h1>Schedule a Date</h1>
            <p>Schedule a date for your camp activities</p>

            <form id="Schedule_controls">
                <div class="Schedule_card">
                    <label>Age</label>
                    <select id="age">
                        <option value="">Select Age</option>
                        <option value="8-11">8-11</option>
                        <option value="12-14">12-14</option>
                        <option value="15-18">15-18</option>
                    </select>
                </div>

                <div class="Schedule_card">
                    <label>Weather</label>
                    <select id="weather">
                        <option value="">Select Weather</option>
                        <option value="sunny">Sunny</option>
                        <option value="cloudy">Cloudy</option>
                        <option value="rainy">Rainy</option>
                    </select>
                </div>

                <div class="Schedule_card">
                    <label>Time of Day</label>
                    <select id="time">
                        <option value="">Select Time</option>
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening">Evening</option>
                    </select>
                </div>

                <div class="Schedule_card">
                    <button
                    type="submit"
                    class="addAppointment_button">Add Appointment
                    </button>
                </div>

            </form>
        </div> 
    </div>
        </main>
</div>
</body>
</html>
